<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #060d1a;
        font-family: Arial, Helvetica, sans-serif;
        color: #e2e8f0;
      }
      #root { position: relative; width: 100%; height: 100%; }
      #root > .clip { position: absolute; inset: 0; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="32"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="seg-diagrama"
        class="clip"
        data-composition-id="seg-diagrama"
        data-composition-src="compositions/seg-diagrama.html"
        data-start="0"
        data-duration="25"
        data-track-index="1"
      ></div>

      <div
        id="seg-takeaway"
        class="clip"
        data-composition-id="seg-takeaway"
        data-composition-src="compositions/seg-takeaway.html"
        data-start="24"
        data-duration="8"
        data-track-index="2"
      ></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
