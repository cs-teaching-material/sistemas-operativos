<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0b1220;
        font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
        color: #e6eefc;
      }

      #root {
        position: relative;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle at 15% 10%, #17294a 0%, #0b1220 60%, #070b15 100%);
      }

      #root > .clip {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="14"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="seg-title"
        class="clip"
        data-composition-id="seg-title"
        data-composition-src="compositions/seg-title.html"
        data-start="0"
        data-duration="3"
        data-track-index="1"
      ></div>

      <div
        id="seg-compare"
        class="clip"
        data-composition-id="seg-compare"
        data-composition-src="compositions/seg-compare.html"
        data-start="2.8"
        data-duration="6.4"
        data-track-index="2"
      ></div>

      <div
        id="seg-takeaway"
        class="clip"
        data-composition-id="seg-takeaway"
        data-composition-src="compositions/seg-takeaway.html"
        data-start="8.9"
        data-duration="5.1"
        data-track-index="3"
      ></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
